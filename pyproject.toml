[project]
name = "slopgate"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai",
    "pydantic>=2",
    "radon",
    "coverage",
    "pytest",
    "contree-sdk>=0.3.6",
    "vulture>=2.16",
    "ruff==0.14.0",
]

[project.optional-dependencies]
hook = ["numpy", "onnx", "onnxruntime", "sentence-transformers<6", "transformers<5", "einops>=0.8.2"]
trace = ["arize-phoenix-otel>=0.17.2", "openinference-instrumentation-openai>=0.1.64"]

[dependency-groups]
dev = ["numpy", "slopgate[trace]"]

[project.scripts]
slopgate = "slopgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-m 'not live'"
pythonpath = ["."]
markers = ["live: calls real Nebius Token Factory"]
